<!DOCTYPE html>
<html lang="zh-CN" data-trae-theme="light"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>工作记录</title>
  <style>
    /* ===== 设计变量 ===== */
    :root {
      --blue: #007aff;
      --blue-light: #e8f1ff;
      --green: #34c759;
      --orange: #ff9500;
      --red: #ff3b30;
      --gray-bg: #f5f5f7;
      --gray-card: #f2f2f7;
      --gray-border: #e5e5ea;
      --gray-text: #8e8e93;
      --text: #1c1c1e;
      --text-sub: #3a3a3c;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.06), 0 2px 4px rgba(0,0,0,0.04);
      --shadow-lg: 0 8px 30px rgba(0,0,0,0.12);
      --radius: 14px;
      --radius-sm: 10px;
    }

    /* ===== 基础样式 ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(180deg, #eef0f4 0%, #f5f5f7 100%);
      color: var(--text);
      line-height: 1.5;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }
    .app { max-width: 640px; margin: 0 auto; min-height: 100vh; background: #fff; position: relative; box-shadow: 0 0 40px rgba(0,0,0,0.04); }
    .hidden { display: none !important; }

    /* ===== 导航栏 ===== */
    .navbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; background: rgba(255,255,255,0.85);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(229,229,234,0.6);
      position: sticky; top: 0; z-index: 50;
    }
    .navbar h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
    .nav-actions { display: flex; gap: 8px; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 50%; border: none;
      background: var(--gray-card); color: var(--blue); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; transition: all .2s;
      box-shadow: var(--shadow-sm);
    }
    .icon-btn:hover { background: #e8e8ed; transform: scale(1.05); }
    .icon-btn:active { transform: scale(0.95); }

    /* ===== 底部导航 ===== */
    .bottom-nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 640px; display: flex; justify-content: space-around;
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(229,229,234,0.6);
      padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
      z-index: 50;
    }
    .nav-item {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      gap: 2px; padding: 4px 0; cursor: pointer; color: var(--gray-text); font-size: 11px;
      border: none; background: none; transition: color .2s;
    }
    .nav-item.active { color: var(--blue); }
    .nav-item .nav-icon { font-size: 22px; transition: transform .2s; }
    .nav-item.active .nav-icon { transform: scale(1.1); }

    /* ===== 页面容器 ===== */
    .page { padding: 16px; padding-bottom: 84px; }

    /* ===== 日历视图 ===== */
    .calendar-header {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;
      padding: 4px 4px;
    }
    .calendar-header h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
    .calendar-nav-btn {
      width: 36px; height: 36px; border-radius: 50%; border: none;
      background: var(--gray-card); cursor: pointer; font-size: 18px; color: var(--blue);
      transition: all .2s; display: flex; align-items: center; justify-content: center;
      box-shadow: var(--shadow-sm);
    }
    .calendar-nav-btn:hover { background: #e8e8ed; }
    .calendar-nav-btn:active { transform: scale(0.92); }
    .calendar-grid {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px;
    }
    .calendar-weekday {
      text-align: center; font-size: 12px; color: var(--gray-text); padding: 8px 0; font-weight: 600;
      letter-spacing: 0.5px;
    }
    .calendar-day {
      aspect-ratio: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; border-radius: 14px; cursor: pointer;
      font-size: 15px; position: relative; transition: all .2s;
      background: var(--gray-card); border: none; color: inherit; font-weight: 500;
    }
    .calendar-day:hover { background: #e8e8ed; transform: scale(1.05); }
    .calendar-day:active { transform: scale(0.95); }
    .calendar-day.other-month { color: #c7c7cc; background: transparent; }
    .calendar-day.today {
      background: linear-gradient(135deg, #007aff, #0056d6); color: #fff;
      box-shadow: 0 2px 10px rgba(0,122,255,0.3); font-weight: 700;
    }
    .calendar-day.today:hover { background: linear-gradient(135deg, #0066d6, #0046b6); }
    /* 日期标记：记录=底部横条，任务=右上角圆点 */
    .calendar-day .day-bar {
      position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%);
      height: 3px; border-radius: 2px; transition: width .2s;
      background: transparent; width: 0;
    }
    .calendar-day.has-entry .day-bar {
      background: #34c759; width: 24px;
    }
    .calendar-day.today.has-entry .day-bar {
      background: #a8e6cf;
    }
    /* 任务圆点 - 右上角 */
    .calendar-day .task-dot {
      position: absolute; top: 5px; right: 5px;
      width: 6px; height: 6px; border-radius: 50%;
      background: transparent;
    }
    .calendar-day.has-pending-task .task-dot {
      background: #ff9500;
    }
    .calendar-day.has-done-task .task-dot {
      background: #34c759;
    }
    .calendar-day.today.has-pending-task .task-dot {
      background: #ffcc80;
    }
    .calendar-day.today.has-done-task .task-dot {
      background: #a8e6cf;
    }
    /* 日历数字轻微上移 */
    .calendar-day.has-content span {
      transform: translateY(-1px);
    }

    /* ===== 日记编辑页 ===== */
    .entry-form { margin-bottom: 16px; }
    .entry-title-input {
      width: 100%; padding: 14px 4px; font-size: 20px; font-weight: 700;
      border: none; border-bottom: 2px solid var(--gray-border); outline: none; background: transparent;
      margin-bottom: 8px; letter-spacing: -0.3px; transition: border-color .2s;
    }
    .entry-title-input:focus { border-bottom-color: var(--blue); }
    .entry-title-input::placeholder { color: #c7c7cc; }
    .editor-toolbar {
      display: flex; gap: 5px; padding: 8px 0; border-bottom: 1px solid var(--gray-border);
      margin-bottom: 10px; flex-wrap: wrap;
    }
    .toolbar-btn {
      width: 34px; height: 34px; border-radius: 9px; border: none;
      background: var(--gray-card); cursor: pointer; font-size: 14px; font-weight: bold;
      display: flex; align-items: center; justify-content: center; color: var(--text);
      transition: all .15s;
    }
    .toolbar-btn:hover { background: #e8e8ed; }
    .toolbar-btn:active { transform: scale(0.92); }
    .toolbar-btn.active { background: var(--blue); color: #fff; }
    .toolbar-btn.img-btn { font-size: 16px; position: relative; overflow: hidden; }
    .toolbar-btn.img-btn input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
    }
    .entry-content-editor img {
      max-width: 100%; border-radius: 10px; margin: 8px 0; cursor: pointer;
      box-shadow: var(--shadow-sm);
    }
    .entry-content-editor {
      min-height: 200px; max-height: 60vh; padding: 14px; font-size: 15px; line-height: 1.7;
      border: 1.5px solid var(--gray-border); border-radius: var(--radius); outline: none;
      background: #fafafa; overflow-y: auto; transition: all .2s;
    }
    .entry-content-editor:focus { border-color: var(--blue); background: #fff; box-shadow: 0 0 0 3px rgba(0,122,255,0.1); }
    .entry-content-editor:empty::before {
      content: attr(placeholder); color: #c7c7cc; pointer-events: none;
    }
    .entry-content-editor ul { padding-left: 20px; }
    .entry-content-editor ol { padding-left: 20px; }
    .entry-content-editor b, .entry-content-editor strong { font-weight: 700; }

    /* ===== 标签选择 ===== */
    .tag-section { margin-top: 14px; }
    .tag-label { font-size: 13px; color: var(--gray-text); margin-bottom: 8px; font-weight: 600; }
    .tag-list { display: flex; flex-wrap: wrap; gap: 7px; }
    .tag-chip {
      padding: 5px 12px; border-radius: 16px; font-size: 13px; cursor: pointer;
      border: 1.5px solid var(--gray-border); background: #fff; color: var(--text-sub);
      transition: all .15s; font-weight: 500;
    }
    .tag-chip:hover { background: var(--blue-light); border-color: var(--blue); color: var(--blue); }
    .tag-chip.selected {
      background: var(--blue); color: #fff; border-color: var(--blue);
      box-shadow: 0 2px 8px rgba(0,122,255,0.25);
    }
    .tag-input-wrapper {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 5px 10px; border-radius: 16px; border: 1.5px solid var(--gray-border); background: #fff;
      transition: border-color .2s;
    }
    .tag-input-wrapper:focus-within { border-color: var(--blue); }
    .tag-input { border: none; outline: none; font-size: 13px; width: 90px; background: transparent; }
    .add-tag-btn { font-size: 18px; color: var(--blue); cursor: pointer; border: none; background: none; line-height: 1; }

    /* ===== 按钮 ===== */
    .btn-primary {
      width: 100%; padding: 14px; border-radius: var(--radius); border: none;
      background: linear-gradient(135deg, #007aff, #0066d6); color: #fff; font-size: 16px; font-weight: 600;
      cursor: pointer; margin-top: 16px; transition: all .2s;
      box-shadow: 0 4px 14px rgba(0,122,255,0.25);
    }
    .btn-primary:active { transform: scale(0.98); box-shadow: 0 2px 8px rgba(0,122,255,0.2); }
    .btn-secondary {
      width: 100%; padding: 14px; border-radius: var(--radius); border: 1.5px solid var(--gray-border);
      background: #fff; color: var(--text); font-size: 16px; cursor: pointer;
      margin-top: 8px; transition: all .2s;
    }
    .btn-secondary:active { background: var(--gray-card); }
    .btn-danger {
      padding: 7px 14px; border-radius: 8px; border: none;
      background: var(--red); color: #fff; font-size: 13px; cursor: pointer; transition: all .2s;
    }
    .btn-danger:active { transform: scale(0.95); }
    .btn-small {
      padding: 7px 14px; border-radius: 8px; border: none;
      background: var(--blue); color: #fff; font-size: 13px; cursor: pointer; transition: all .2s;
      box-shadow: 0 2px 8px rgba(0,122,255,0.2);
    }
    .btn-small:active { transform: scale(0.95); }
    .btn-ghost {
      padding: 7px 14px; border-radius: 8px; border: 1.5px solid var(--gray-border);
      background: #fff; color: var(--text); font-size: 13px; cursor: pointer; transition: all .2s;
    }
    .btn-ghost:active { background: var(--gray-card); }

    /* ===== 某天详情页 ===== */
    .day-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px;
    }
    .day-header h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
    .day-date { font-size: 14px; color: var(--gray-text); margin-top: 2px; }

    /* 任务清单 */
    .task-list-section { margin-bottom: 24px; }
    .section-title {
      font-size: 13px; font-weight: 700; color: var(--gray-text);
      text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 12px;
    }
    .task-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px; background: #fff; border: 1px solid var(--gray-border);
      border-radius: var(--radius-sm); margin-bottom: 8px;
      box-shadow: var(--shadow-sm); transition: all .15s;
    }
    .task-item:hover { box-shadow: var(--shadow-md); }
    .task-checkbox {
      width: 24px; height: 24px; border-radius: 50%;
      border: 2px solid #c7c7cc; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: #fff; transition: all .2s;
    }
    .task-checkbox:hover { border-color: var(--green); }
    .task-checkbox.checked {
      background: var(--green); border-color: var(--green);
      box-shadow: 0 2px 8px rgba(52,199,89,0.3);
    }
    .task-checkbox.checked::after {
      content: '✓'; color: #fff; font-size: 13px; font-weight: bold;
    }
    .task-title { font-size: 15px; transition: all .2s; flex: 1; }
    .task-title.completed { text-decoration: line-through; color: var(--gray-text); }

    /* 日记条目列表 */
    .entry-card {
      background: #fff; border: 1px solid var(--gray-border); border-left: 3px solid var(--blue);
      border-radius: var(--radius-sm); padding: 14px 16px; margin-bottom: 10px;
      cursor: pointer; transition: all .15s; box-shadow: var(--shadow-sm);
    }
    .entry-card:hover { box-shadow: var(--shadow-md); transform: translateX(2px); }
    .entry-card:active { transform: translateX(0); }
    .entry-card-header {
      display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px;
    }
    .entry-card-title { font-size: 16px; font-weight: 600; flex: 1; }
    .entry-card-time { font-size: 12px; color: var(--gray-text); white-space: nowrap; background: var(--gray-card); padding: 2px 8px; border-radius: 8px; }
    .entry-card-preview {
      font-size: 14px; color: var(--text-sub); overflow: hidden;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }
    .entry-card-tags {
      display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap;
    }
    .entry-card-tag {
      font-size: 11px; padding: 3px 9px; border-radius: 10px;
      background: var(--blue-light); color: var(--blue); font-weight: 500;
    }

    /* ===== 任务管理页 ===== */
    .task-form {
      background: #fff; border: 1px solid var(--gray-border); border-radius: var(--radius);
      padding: 18px; margin-bottom: 24px; box-shadow: var(--shadow-sm);
    }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; color: var(--gray-text); margin-bottom: 5px; font-weight: 600; }
    .form-input {
      width: 100%; padding: 11px 14px; border-radius: var(--radius-sm); border: 1.5px solid var(--gray-border);
      font-size: 15px; outline: none; background: #fff; transition: all .2s;
    }
    .form-input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0,122,255,0.1); }
    .form-select {
      width: 100%; padding: 11px 14px; border-radius: var(--radius-sm); border: 1.5px solid var(--gray-border);
      font-size: 15px; outline: none; background: #fff; transition: all .2s;
    }
    .form-select:focus { border-color: var(--blue); }
    .weekday-selector { display: flex; gap: 7px; flex-wrap: wrap; }
    .weekday-btn {
      width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--gray-border);
      background: #fff; cursor: pointer; font-size: 13px; transition: all .15s;
    }
    .weekday-btn:hover { background: var(--blue-light); }
    .weekday-btn.selected { background: var(--blue); color: #fff; border-color: var(--blue); box-shadow: 0 2px 8px rgba(0,122,255,0.25); }

    .task-list-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; background: #fff; border: 1px solid var(--gray-border);
      border-radius: var(--radius-sm); margin-bottom: 8px; box-shadow: var(--shadow-sm);
      transition: all .15s;
    }
    .task-list-item:hover { box-shadow: var(--shadow-md); }
    .task-list-item-info { flex: 1; }
    .task-list-item-title { font-size: 15px; font-weight: 600; }
    .task-list-item-meta { font-size: 12px; color: var(--gray-text); margin-top: 3px; }
    .task-list-item-actions { display: flex; gap: 6px; }

    /* ===== 搜索页 ===== */
    .search-input-wrapper {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 14px; background: #fff; border: 1.5px solid var(--gray-border);
      border-radius: var(--radius); margin-bottom: 18px; transition: all .2s;
      box-shadow: var(--shadow-sm);
    }
    .search-input-wrapper:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0,122,255,0.1); }
    .search-input {
      flex: 1; border: none; outline: none; font-size: 15px; background: transparent;
    }
    .filter-section { margin-bottom: 18px; }
    .filter-title { font-size: 13px; color: var(--gray-text); margin-bottom: 8px; font-weight: 600; }

    .search-result-item {
      padding: 14px 16px; background: #fff; border: 1px solid var(--gray-border);
      border-left: 3px solid var(--blue); border-radius: var(--radius-sm); margin-bottom: 10px;
      cursor: pointer; transition: all .15s; box-shadow: var(--shadow-sm);
    }
    .search-result-item:hover { box-shadow: var(--shadow-md); transform: translateX(2px); }
    .search-result-date { font-size: 12px; color: var(--gray-text); margin-bottom: 4px; }
    .search-result-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .search-result-preview { font-size: 14px; color: var(--text-sub); }

    /* ===== 标签页 ===== */
    .tag-manage-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; background: #fff; border: 1px solid var(--gray-border);
      border-radius: var(--radius-sm); margin-bottom: 8px; box-shadow: var(--shadow-sm);
      transition: all .15s;
    }
    .tag-manage-item:hover { box-shadow: var(--shadow-md); }
    .tag-manage-name { font-size: 15px; font-weight: 600; }
    .tag-manage-count { font-size: 13px; color: var(--gray-text); margin-top: 3px; }

    /* ===== 空状态 ===== */
    .empty-state {
      text-align: center; padding: 60px 20px; color: var(--gray-text);
    }
    .empty-state-icon { font-size: 52px; margin-bottom: 14px; opacity: 0.5; }
    .empty-state-text { font-size: 15px; }

    /* ===== 弹窗 ===== */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center;
      z-index: 100; padding: 20px; backdrop-filter: blur(4px);
    }
    .modal-content {
      background: #fff; border-radius: 20px; padding: 24px;
      width: 100%; max-width: 400px; max-height: 80vh; overflow-y: auto;
      box-shadow: var(--shadow-lg);
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .modal-header h3 { font-size: 18px; font-weight: 700; }
    .modal-close { font-size: 26px; color: var(--gray-text); cursor: pointer; border: none; background: none; line-height: 1; transition: color .2s; }
    .modal-close:hover { color: var(--text); }

    /* ===== 滚动条 ===== */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #c7c7cc; border-radius: 4px; }

    /* ===== 日期悬浮预览卡片 ===== */
    .day-tooltip {
      position: fixed; z-index: 200; background: #fff; border-radius: 18px;
      box-shadow: var(--shadow-lg); width: 420px; max-height: 360px;
      overflow: hidden; font-size: 14px; pointer-events: none; opacity: 0;
      transition: opacity .2s; border: 1px solid var(--gray-border);
    }
    .day-tooltip.visible { opacity: 1; }
    .day-tooltip-header {
      padding: 12px 16px; background: linear-gradient(135deg, var(--blue-light), #f0f6ff); font-weight: 700; font-size: 14px;
      border-bottom: 1px solid var(--gray-border); display: flex; justify-content: space-between; align-items: center;
    }
    .day-tooltip-body {
      display: flex; max-height: 300px; overflow-y: auto;
    }
    .day-tooltip-tasks {
      width: 160px; padding: 12px 14px; border-right: 1px solid var(--gray-border);
      flex-shrink: 0;
    }
    .day-tooltip-tasks-title {
      font-size: 11px; font-weight: 700; color: var(--blue); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .day-tooltip-task-item {
      display: flex; align-items: center; gap: 6px; margin-bottom: 7px;
      font-size: 13px; color: var(--text-sub);
    }
    .day-tooltip-task-dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
    }
    .day-tooltip-task-dot.done { background: var(--green); }
    .day-tooltip-task-dot.pending { background: var(--orange); }
    .day-tooltip-task-text.done { text-decoration: line-through; color: var(--gray-text); }
    .day-tooltip-entries {
      flex: 1; padding: 12px 14px; min-width: 0;
    }
    .day-tooltip-entries-title {
      font-size: 11px; font-weight: 700; color: var(--blue); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .day-tooltip-entry-item {
      margin-bottom: 10px;
    }
    .day-tooltip-entry-title {
      font-size: 13px; font-weight: 600; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .day-tooltip-entry-time {
      font-size: 11px; color: var(--gray-text); margin-top: 1px;
    }
    .day-tooltip-entry-preview {
      font-size: 12px; color: var(--gray-text); margin-top: 2px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .day-tooltip-empty {
      color: #c7c7cc; font-size: 12px; text-align: center; padding: 16px 0;
    }
    .day-tooltip-close {
      display: none; position: absolute; top: 8px; right: 12px;
      font-size: 22px; color: var(--gray-text); background: none; border: none; cursor: pointer; line-height: 1;
    }

  <script>
    /* ===================== 数据存储 ===================== */
    const STORAGE_KEYS = {
      entries: 'worklog_entries_v1',
      recurringTasks: 'worklog_tasks_v1',
      tags: 'worklog_tags_v1',
      completions: 'worklog_completions_v1',
      oneTimeTasks: 'worklog_onetime_tasks_v1'
    };

    function loadData(key, defaultVal = []) {
      try {
        const data = localStorage.getItem(key);
        return data ? JSON.parse(data) : defaultVal;
      } catch { return defaultVal; }
    }
    function saveData(key, data) {
      localStorage.setItem(key, JSON.stringify(data));
    }

    let entries = loadData(STORAGE_KEYS.entries);
    let recurringTasks = loadData(STORAGE_KEYS.recurringTasks);
    let tags = loadData(STORAGE_KEYS.tags, ['项目A', '会议', '学习']);
    let completions = loadData(STORAGE_KEYS.completions, {});
    let oneTimeTasks = loadData(STORAGE_KEYS.oneTimeTasks);

    /* ===================== 状态 ===================== */
    let currentView = 'calendar';
    let currentDate = new Date();
    let selectedDate = null;
    let editingEntryId = null;
    let editingTaskId = null;
    let selectedTags = new Set();
    let selectedWeekDays = new Set();
    let searchSelectedTag = null;
    let contextMenuDate = null;

    /* ===================== 工具函数 ===================== */
    function formatDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }
    function formatDateCN(dateStr) {
      const [y, m, d] = dateStr.split('-');
      return `${y}年${parseInt(m)}月${parseInt(d)}日`;
    }
    function formatTime(ts) {
      const d = new Date(ts);
      return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }
    function getMonthData(year, month) {
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const daysInMonth = lastDay.getDate();
      const startWeekDay = firstDay.getDay();
      const prevLastDay = new Date(year, month, 0).getDate();
      const days = [];
      for (let i = startWeekDay - 1; i >= 0; i--) {
        days.push({ day: prevLastDay - i, month: month - 1, other: true });
      }
      for (let i = 1; i <= daysInMonth; i++) {
        days.push({ day: i, month, other: false });
      }
      const remaining = (7 - (days.length % 7)) % 7;
      for (let i = 1; i <= remaining; i++) {
        days.push({ day: i, month: month + 1, other: true });
      }
      return days;
    }
    function getEntriesForDate(dateStr) {
      return entries.filter(e => e.date === dateStr).sort((a, b) => b.timestamp - a.timestamp);
    }
    function parseLocalDate(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      return new Date(y, m - 1, d);
    }
    function getTasksForDate(dateStr) {
      const d = parseLocalDate(dateStr);
      const weekDay = d.getDay();
      return recurringTasks.filter(t => {
        if (!t.active) return false;
        if (t.frequency === 'daily') return true;
        if (t.frequency === 'weekly') return t.weekDays && t.weekDays.includes(weekDay);
        if (t.frequency === 'custom') {
          const created = parseLocalDate(t.createdAt);
          const diff = Math.floor((d - created) / (1000 * 60 * 60 * 24));
          return diff >= 0 && diff % t.interval === 0;
        }
        return false;
      });
    }
    function isTaskCompleted(taskId, dateStr) {
      return completions[`${taskId}|${dateStr}`] || false;
    }
    function toggleTaskComplete(taskId, dateStr) {
      const key = `${taskId}|${dateStr}`;
      completions[key] = !completions[key];
      saveData(STORAGE_KEYS.completions, completions);
    }
    function getAllTasksForDate(dateStr) {
      const recurring = getTasksForDate(dateStr);
      const oneTime = oneTimeTasks.filter(t => t.date === dateStr);
      return [...oneTime, ...recurring];
    }
    function addOneTimeTask(dateStr, title) {
      const task = { id: generateId(), date: dateStr, title, createdAt: Date.now() };
      oneTimeTasks.push(task);
      saveData(STORAGE_KEYS.oneTimeTasks, oneTimeTasks);
      return task;
    }
    function deleteOneTimeTask(id) {
      oneTimeTasks = oneTimeTasks.filter(t => t.id !== id);
      saveData(STORAGE_KEYS.oneTimeTasks, oneTimeTasks);
    }
    function stripHtml(html) {
      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      return tmp.textContent || tmp.innerText || '';
    }
    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
    }

    /* ===================== 页面切换 ===================== */
    function showView(view) {
      currentView = view;
      document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

      const titles = {
        calendar: '工作记录',
        day: selectedDate ? formatDateCN(selectedDate) : '详情',
        edit: editingEntryId ? '编辑记录' : '新建记录',
        tasks: '任务',
        search: '搜索',
        tags: '标签管理'
      };
      document.getElementById('pageTitle').textContent = titles[view] || '工作记录';

      const backViews = ['day', 'edit'];
      document.getElementById('backBtn').style.display = backViews.includes(view) ? 'flex' : 'none';
      document.getElementById('addEntryBtn').style.display = view === 'day' ? 'flex' : 'none';
      document.getElementById('searchNavBtn').style.display = ['calendar', 'search'].includes(view) ? 'flex' : 'none';
      document.getElementById('settingsBtn').style.display = view === 'calendar' ? 'flex' : 'none';

      if (view === 'calendar') {
        document.getElementById('calendarPage').classList.remove('hidden');
        document.querySelector('[data-page="calendar"]').classList.add('active');
        renderCalendar();
      } else if (view === 'day') {
        document.getElementById('dayPage').classList.remove('hidden');
        renderDayPage();
      } else if (view === 'edit') {
        document.getElementById('editPage').classList.remove('hidden');
        renderEditPage();
      } else if (view === 'tasks') {
        document.getElementById('tasksPage').classList.remove('hidden');
        document.querySelector('[data-page="tasks"]').classList.add('active');
        renderTasksPage();
      } else if (view === 'search') {
        document.getElementById('searchPage').classList.remove('hidden');
        document.querySelector('[data-page="calendar"]').classList.add('active');
        renderSearchPage();
      } else if (view === 'tags') {
        document.getElementById('tagsPage').classList.remove('hidden');
        document.querySelector('[data-page="tags"]').classList.add('active');
        renderTagsPage();
      }
    }

    /* ===================== 日历渲染 ===================== */
    let tooltipTimer = null;

    function showDayTooltip(btn, dateStr) {
      const tooltip = document.getElementById('dayTooltip');
      const rect = btn.getBoundingClientRect();
      document.getElementById('tooltipDate').textContent = formatDateCN(dateStr);

      const dayTasks = getAllTasksForDate(dateStr);
      const dayEntries = getEntriesForDate(dateStr);
      document.getElementById('tooltipSummary').textContent = `${dayTasks.length}个任务 · ${dayEntries.length}条记录`;

      // 渲染任务列表
      const tasksHtml = dayTasks.length === 0
        ? '<div class="day-tooltip-empty">暂无任务</div>'
        : dayTasks.map(t => {
            const done = isTaskCompleted(t.id, dateStr);
            return `<div class="day-tooltip-task-item">
              <div class="day-tooltip-task-dot ${done ? 'done' : 'pending'}"></div>
              <div class="day-tooltip-task-text ${done ? 'done' : ''}">${escapeHtml(t.title)}</div>
            </div>`;
          }).join('');
      document.getElementById('tooltipTasks').innerHTML = tasksHtml;

      // 渲染记录列表
      const entriesHtml = dayEntries.length === 0
        ? '<div class="day-tooltip-empty">暂无记录</div>'
        : dayEntries.slice(0, 5).map(e => {
            const preview = stripHtml(e.content).substring(0, 50);
            return `<div class="day-tooltip-entry-item">
              <div class="day-tooltip-entry-title">${escapeHtml(e.title || '无标题')}</div>
              <div class="day-tooltip-entry-time">${formatTime(e.timestamp)}</div>
              ${preview ? `<div class="day-tooltip-entry-preview">${escapeHtml(preview)}</div>` : ''}
            </div>`;
          }).join('');
      document.getElementById('tooltipEntries').innerHTML = entriesHtml;

      // 定位
      const tooltipWidth = 420;
      let left = rect.right + 10;
      let top = rect.top;
      if (left + tooltipWidth > window.innerWidth) {
        left = rect.left - tooltipWidth - 10;
      }
      if (top + 360 > window.innerHeight) {
        top = window.innerHeight - 370;
      }
      if (top < 10) top = 10;

      tooltip.style.left = left + 'px';
      tooltip.style.top = top + 'px';
      tooltip.classList.add('visible');
    }

    function hideDayTooltip() {
      document.getElementById('dayTooltip').classList.remove('visible');
    }

    function showContextMenu(x, y, dateStr) {
      contextMenuDate = dateStr;
      const menu = document.getElementById('contextMenu');
      menu.style.left = x + 'px';
      menu.style.top = y + 'px';
      menu.classList.add('visible');
      // 防止超出屏幕
      requestAnimationFrame(() => {
        const r = menu.getBoundingClientRect();
        if (r.right > window.innerWidth) menu.style.left = (x - r.width) + 'px';
        if (r.bottom > window.innerHeight) menu.style.top = (y - r.height) + 'px';
      });
    }

    function hideContextMenu() {
      document.getElementById('contextMenu').classList.remove('visible');
      contextMenuDate = null;
    }

    function showQuickTaskModal(dateStr) {

      overlay.innerHTML = `
        <div class="modal-content">
          <div class="modal-header">

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      document.getElementById('calendarMonth').textContent = `${year}年${month + 1}月`;

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
      weekdays.forEach(w => {
        const el = document.createElement('div');
        el.className = 'calendar-weekday';
        el.textContent = w;
        grid.appendChild(el);
      });

      const days = getMonthData(year, month);
      const today = formatDate(new Date());
      const entryDates = new Set(entries.map(e => e.date));
      days.forEach(({ day, month: m, other }) => {
        const date = new Date(year, m, day);
        const dateStr = formatDate(date);
        const btn = document.createElement('button');
        let cls = 'calendar-day';
        if (other) cls += ' other-month';
        if (dateStr === today) cls += ' today';
        const hasE = entryDates.has(dateStr);
        const dayTasks = getAllTasksForDate(dateStr);
        const hasPending = dayTasks.length > 0 && dayTasks.some(t => !isTaskCompleted(t.id, dateStr));
        const hasDone = dayTasks.length > 0 && dayTasks.every(t => isTaskCompleted(t.id, dateStr));
        if (hasE) cls += ' has-entry';
        if (hasPending) cls += ' has-pending-task';
        if (hasDone) cls += ' has-done-task';
        if (hasE || dayTasks.length > 0) cls += ' has-content';
        btn.className = cls;
        btn.dataset.date = dateStr;
        btn.innerHTML = `<span>${day}</span><div class="day-bar"></div><div class="task-dot"></div>`;
        btn.addEventListener('click', e => {
          if (isTouchDevice && Date.now() - lastTouchEndTime < 400) return;
          selectedDate = dateStr;
          hideDayTooltip();
          showView('day');
        });
        // 鼠标悬浮显示预览卡片（仅非触摸设备）
        if (!isTouchDevice) {
          btn.addEventListener('mouseenter', () => {
            clearTimeout(tooltipTimer);
            tooltipTimer = setTimeout(() => showDayTooltip(btn, dateStr), 400);
          });
          btn.addEventListener('mouseleave', () => {
            clearTimeout(tooltipTimer);
            tooltipTimer = setTimeout(hideDayTooltip, 200);
          });
        }
        // 右键菜单（仅桌面端）
        if (!isTouchDevice) {
          btn.addEventListener('contextmenu', e => {
            e.preventDefault();
            hideDayTooltip();
            showContextMenu(e.clientX, e.clientY, dateStr);
          });
        }
        grid.appendChild(btn);
      });
    }

              <div class="entry-card-time">${formatTime(entry.timestamp)}</div>

            <div class="entry-card-preview">${escapeHtml(preview)}</div>

    /* ===================== 编辑页 ===================== */
    function renderEditPage() {
      selectedTags.clear();
      document.getElementById('deleteEntryBtn').classList.toggle('hidden', !editingEntryId);

      if (editingEntryId) {
        const entry = entries.find(e => e.id === editingEntryId);
        if (entry) {
          document.getElementById('entryTitle').value = entry.title || '';
          document.getElementById('entryEditor').innerHTML = entry.content || '';
          entry.tags.forEach(t => selectedTags.add(t));
        }
      } else {
        document.getElementById('entryTitle').value = '';
        document.getElementById('entryEditor').innerHTML = '';
      }
      renderTagList();
    }

    function renderTagList() {
      const container = document.getElementById('tagList');
      container.innerHTML = '';
      tags.forEach(tag => {
        const chip = document.createElement('button');
        chip.className = 'tag-chip' + (selectedTags.has(tag) ? ' selected' : '');
        chip.textContent = tag;
        chip.addEventListener('click', () => {
          if (selectedTags.has(tag)) selectedTags.delete(tag);
          else selectedTags.add(tag);
          renderTagList();
        });
        container.appendChild(chip);
      });
      const wrapper = document.createElement('div');
      wrapper.className = 'tag-input-wrapper';
      wrapper.innerHTML = `<input type="text" class="tag-input" id="newTagInput" placeholder="输入新标签回车添加"><button class="add-tag-btn">+</button>`;
      wrapper.querySelector('.add-tag-btn').addEventListener('click', addNewTag);
      wrapper.querySelector('input').addEventListener('keypress', e => { if (e.key === 'Enter') addNewTag(); });
      container.appendChild(wrapper);
    }

    function addNewTag() {
      const input = document.getElementById('newTagInput');
      const name = input.value.trim();
      if (!name) return;
      if (!tags.includes(name)) {
        tags.push(name);
        saveData(STORAGE_KEYS.tags, tags);
      }
      selectedTags.add(name);
      input.value = '';
      renderTagList();
    }

    function saveEntry() {
      const title = document.getElementById('entryTitle').value.trim();
      const content = document.getElementById('entryEditor').innerHTML;
      if (!title && !content.trim()) {
        alert('请填写内容');
        return;
      }
      const entry = {
        id: editingEntryId || generateId(),
        date: selectedDate || formatDate(new Date()),
        title: title || '无标题',
        content,
        tags: Array.from(selectedTags),
        timestamp: editingEntryId ? (entries.find(e => e.id === editingEntryId)?.timestamp || Date.now()) : Date.now()
      };
      if (editingEntryId) {
        const idx = entries.findIndex(e => e.id === editingEntryId);
        if (idx >= 0) entries[idx] = entry;
      } else {
        entries.push(entry);
      }
      saveData(STORAGE_KEYS.entries, entries);
      selectedDate = entry.date;
      showView('day');
    }

    /* ===================== 任务管理页 ===================== */
    function renderTasksPage() {
      document.getElementById('taskTitleInput').value = '';
      document.getElementById('taskFrequency').value = 'once';
      document.getElementById('onceDateInput').value = formatDate(new Date());
      document.getElementById('customInterval').value = '2';
      selectedWeekDays.clear();
      document.querySelectorAll('.weekday-btn').forEach(b => b.classList.remove('selected'));
      document.getElementById('onceDateGroup').classList.remove('hidden');
      document.getElementById('weekDayGroup').classList.add('hidden');
      document.getElementById('customIntervalGroup').classList.add('hidden');
      document.getElementById('cancelTaskEditBtn').classList.add('hidden');
      document.getElementById('saveTaskBtn').textContent = '保存任务';
      editingTaskId = null;
      renderAllTasksList();
    }

    function renderAllTasksList() {
      const list = document.getElementById('recurringTaskList');
      list.innerHTML = '';

      // 合并所有任务：单次任务 + 重复任务
      const allTasks = [
        ...oneTimeTasks.map(t => ({ ...t, type: 'once', source: 'oneTime' })),
        ...recurringTasks.map(t => ({ ...t, type: 'recurring', source: 'recurring' }))
      ];

      if (allTasks.length === 0) {
        document.getElementById('taskEmptyState').style.display = 'block';
      } else {
        document.getElementById('taskEmptyState').style.display = 'none';
        allTasks.forEach(t => {
          const el = document.createElement('div');
          el.className = 'task-list-item';
          let dateLabel = '';
          if (t.type === 'once') {
            dateLabel = `📅 ${formatDateCN(t.date)}`;
          } else {
            const freqText = { daily: '🔄 每天', weekly: '🔄 每周', custom: `🔄 每${t.interval}天` }[t.frequency] || t.frequency;
            const weekText = t.weekDays ? t.weekDays.map(d => ['日','一','二','三','四','五','六'][d]).join('、') : '';
            dateLabel = freqText + (t.frequency === 'weekly' ? '（' + weekText + '）' : '');
          }
          el.innerHTML = `
            <div class="task-list-item-info">
              <div class="task-list-item-title">${escapeHtml(t.title)} ${t.type === 'recurring' && !t.active ? '<span style="color:#ff3b30">(已暂停)</span>' : ''}</div>
              <div class="task-list-item-meta">${dateLabel}</div>
            </div>
            <div class="task-list-item-actions">
              ${t.type === 'once' ? '<button class="btn-ghost" data-edit-once="' + t.id + '">编辑</button>' : '<button class="btn-ghost" data-edit="' + t.id + '">编辑</button>'}
              ${t.type === 'recurring' ? '<button class="btn-small" data-toggle="' + t.id + '">' + (t.active ? '暂停' : '启用') + '</button>' : ''}
              <button class="btn-danger" data-delete-task="' + t.id + '" data-delete-src="' + t.source + '">删除</button>
            </div>
          `;
          if (t.type === 'once') {
            el.querySelector('[data-edit-once]').addEventListener('click', () => editOneTimeTask(t.id));
          } else {
            el.querySelector('[data-edit]').addEventListener('click', () => editTask(t.id));
            el.querySelector('[data-toggle]').addEventListener('click', () => toggleTaskActive(t.id));
          }
          el.querySelector('[data-delete-task]').addEventListener('click', function() {
            deleteTask(this.dataset.deleteSrc, this.dataset.deleteTask);
          });
          list.appendChild(el);
        });
      }
    }

    function saveTask() {
      const title = document.getElementById('taskTitleInput').value.trim();
      if (!title) { alert('请输入任务名称'); return; }
      const frequency = document.getElementById('taskFrequency').value;

      if (frequency === 'once') {
        const dateStr = document.getElementById('onceDateInput').value;
        if (!dateStr) { alert('请选择任务日期'); return; }
        if (editingTaskId) {
          const idx = oneTimeTasks.findIndex(t => t.id === editingTaskId);
          if (idx >= 0) {
            oneTimeTasks[idx].title = title;
            oneTimeTasks[idx].date = dateStr;
          }
        } else {
          oneTimeTasks.push({ id: generateId(), date: dateStr, title, createdAt: Date.now() });
        }
        saveData(STORAGE_KEYS.oneTimeTasks, oneTimeTasks);
      } else {
        const task = {
          id: editingTaskId || generateId(),
          title,
          frequency,
          interval: frequency === 'custom' ? parseInt(document.getElementById('customInterval').value) || 2 : null,
          weekDays: frequency === 'weekly' ? Array.from(selectedWeekDays).sort((a,b)=>a-b) : null,
          active: true,
          createdAt: editingTaskId ? (recurringTasks.find(t=>t.id===editingTaskId)?.createdAt || formatDate(new Date())) : formatDate(new Date()),
          updatedAt: Date.now()
        };
        if (editingTaskId) {
          const idx = recurringTasks.findIndex(t => t.id === editingTaskId);
          if (idx >= 0) recurringTasks[idx] = task;
        } else {
          recurringTasks.push(task);
        }
        saveData(STORAGE_KEYS.recurringTasks, recurringTasks);
      }
      renderTasksPage();
    }

    function editTask(id) {
      const t = recurringTasks.find(x => x.id === id);
      if (!t) return;
      editingTaskId = id;
      document.getElementById('taskTitleInput').value = t.title;
      document.getElementById('taskFrequency').value = t.frequency;
      document.getElementById('onceDateGroup').classList.add('hidden');
      document.getElementById('saveTaskBtn').textContent = '更新任务';
      document.getElementById('cancelTaskEditBtn').classList.remove('hidden');

      if (t.frequency === 'weekly') {
        document.getElementById('weekDayGroup').classList.remove('hidden');
        selectedWeekDays = new Set(t.weekDays || []);
        document.querySelectorAll('.weekday-btn').forEach(b => {
          b.classList.toggle('selected', selectedWeekDays.has(parseInt(b.dataset.day)));
        });
      } else if (t.frequency === 'custom') {
        document.getElementById('customIntervalGroup').classList.remove('hidden');
        document.getElementById('customInterval').value = t.interval || 2;
      }
    }

    function editOneTimeTask(id) {
      const t = oneTimeTasks.find(x => x.id === id);
      if (!t) return;
      editingTaskId = id;
      document.getElementById('taskTitleInput').value = t.title;
      document.getElementById('taskFrequency').value = 'once';
      document.getElementById('onceDateInput').value = t.date;
      document.getElementById('onceDateGroup').classList.remove('hidden');
      document.getElementById('weekDayGroup').classList.add('hidden');
      document.getElementById('customIntervalGroup').classList.add('hidden');
      document.getElementById('saveTaskBtn').textContent = '更新任务';
      document.getElementById('cancelTaskEditBtn').classList.remove('hidden');
    }

    function toggleTaskActive(id) {
      const t = recurringTasks.find(x => x.id === id);
      if (t) { t.active = !t.active; saveData(STORAGE_KEYS.recurringTasks, recurringTasks); renderTasksPage(); }
    }
    function deleteTask(source, id) {
      if (!confirm('确定删除这个任务吗？')) return;
      if (source === 'recurring') {
        recurringTasks = recurringTasks.filter(t => t.id !== id);
        saveData(STORAGE_KEYS.recurringTasks, recurringTasks);
      } else {
        oneTimeTasks = oneTimeTasks.filter(t => t.id !== id);
        saveData(STORAGE_KEYS.oneTimeTasks, oneTimeTasks);
      }
      renderTasksPage();
    }

    /* ===================== 搜索页 ===================== */
    function renderSearchPage() {
      const container = document.getElementById('searchTagList');
      container.innerHTML = '';
      const allChip = document.createElement('button');
      allChip.className = 'tag-chip' + (!searchSelectedTag ? ' selected' : '');
      allChip.textContent = '全部';
      allChip.addEventListener('click', () => { searchSelectedTag = null; doSearch(); });
      container.appendChild(allChip);
      tags.forEach(tag => {
        const chip = document.createElement('button');
        chip.className = 'tag-chip' + (searchSelectedTag === tag ? ' selected' : '');
        chip.textContent = tag;
        chip.addEventListener('click', () => { searchSelectedTag = tag; doSearch(); });
        container.appendChild(chip);
      });
      doSearch();
    }

    function doSearch() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const results = document.getElementById('searchResults');
      results.innerHTML = '';

      let filtered = [...entries];
      if (query) {
        filtered = filtered.filter(e =>
          (e.title || '').toLowerCase().includes(query) ||
          stripHtml(e.content).toLowerCase().includes(query)
        );
      }
      if (searchSelectedTag) {
        filtered = filtered.filter(e => e.tags.includes(searchSelectedTag));
      }
      filtered.sort((a, b) => b.timestamp - a.timestamp);

      document.querySelectorAll('#searchTagList .tag-chip').forEach(c => {
        c.classList.toggle('selected', (!searchSelectedTag && c.textContent === '全部') || c.textContent === searchSelectedTag);
      });

      if (filtered.length === 0) {
        document.getElementById('searchEmptyState').style.display = 'block';
        document.getElementById('searchEmptyState').querySelector('.empty-state-text').textContent =
          query || searchSelectedTag ? '没有找到匹配的记录' : '输入关键词开始搜索';
      } else {
        document.getElementById('searchEmptyState').style.display = 'none';
        filtered.forEach(entry => {
          const el = document.createElement('div');
          el.className = 'search-result-item';
          const preview = stripHtml(entry.content).substring(0, 100);
          el.innerHTML = `
            <div class="search-result-date">${formatDateCN(entry.date)} ${formatTime(entry.timestamp)}</div>
            <div class="search-result-title">${escapeHtml(entry.title || '无标题')}</div>
            <div class="search-result-preview">${escapeHtml(preview)}</div>
            ${entry.tags.length ? `<div class="entry-card-tags" style="margin-top:6px">${entry.tags.map(t => `<span class="entry-card-tag">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
          `;
          el.addEventListener('click', () => {
            selectedDate = entry.date;
            editingEntryId = entry.id;
            showView('edit');
          });
          results.appendChild(el);
        });
      }
    }

    /* ===================== 标签管理页 ===================== */
    function renderTagsPage() {
      const list = document.getElementById('tagsList');
      list.innerHTML = '';

      // 新增标签输入区
      const addSection = document.createElement('div');
      addSection.className = 'tag-input-wrapper';
      addSection.style.cssText = 'width:100%; padding:10px 12px; margin-bottom:16px;';
      addSection.innerHTML = `
        <input type="text" class="tag-input" id="manageNewTagInput" placeholder="输入新标签名称" style="flex:1;width:auto;">
        <button class="add-tag-btn" id="manageAddTagBtn">+</button>
      `;
      addSection.querySelector('#manageAddTagBtn').addEventListener('click', () => {
        const input = document.getElementById('manageNewTagInput');
        const name = input.value.trim();
        if (!name) return;
        if (!tags.includes(name)) {
          tags.push(name);
          saveData(STORAGE_KEYS.tags, tags);
        }
        input.value = '';
        renderTagsPage();
      });
      addSection.querySelector('input').addEventListener('keypress', e => {
        if (e.key === 'Enter') addSection.querySelector('#manageAddTagBtn').click();
      });
      list.appendChild(addSection);

      if (tags.length === 0) {
        document.getElementById('tagsEmptyState').classList.remove('hidden');
      } else {
        document.getElementById('tagsEmptyState').classList.add('hidden');
        tags.forEach(tag => {
          const count = entries.filter(e => e.tags.includes(tag)).length;
          const el = document.createElement('div');
          el.className = 'tag-manage-item';
          el.innerHTML = `
            <div>
              <div class="tag-manage-name">${escapeHtml(tag)}</div>
              <div class="tag-manage-count">${count} 条记录</div>
            </div>
            <button class="btn-danger" data-tag="${escapeHtml(tag)}">删除</button>
          `;
          el.querySelector('button').addEventListener('click', () => deleteTag(tag));

    function deleteTag(tag) {
      if (!confirm(`删除标签"${tag}"？记录中将移除此标签。`)) return;
      tags = tags.filter(t => t !== tag);
      entries.forEach(e => { e.tags = e.tags.filter(t => t !== tag); });
      saveData(STORAGE_KEYS.tags, tags);
      saveData(STORAGE_KEYS.entries, entries);
      renderTagsPage();
    }

    /* ===================== 工具函数 ===================== */
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

      editingEntryId = null;
      showView('edit');

      editingEntryId = null;
      showView('edit');
    });

    document.getElementById('saveEntryBtn').addEventListener('click', saveEntry);

      if (!confirm('确定删除这条记录吗？')) return;

      document.getElementById('customIntervalGroup').classList.toggle('hidden', e.target.value !== 'custom');
    });

    document.querySelectorAll('.weekday-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const day = parseInt(btn.dataset.day);

        else selectedWeekDays.add(day);
        btn.classList.toggle('selected', selectedWeekDays.has(day));
      });
    });

    document.getElementById('saveTaskBtn').addEventListener('click', saveTask);
    document.getElementById('cancelTaskEditBtn').addEventListener('click', renderTasksPage);

    document.getElementById('searchInput').addEventListener('input', doSearch);
    document.getElementById('searchNavBtn').addEventListener('click', () => showView('search'));

    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', () => {
        const page = item.dataset.page;
        if (page === 'calendar') { currentDate = new Date(); }
        showView(page);
      });
    });

    // 图片压缩函数
    function compressImage(file, maxWidth, quality, callback) {
      maxWidth = maxWidth || 1200;
      quality = quality || 0.75;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          if (img.width <= maxWidth) {
            // 无需缩放的图片也用 JPEG 压缩
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            callback(canvas.toDataURL('image/jpeg', quality));
            return;
          }
          const ratio = maxWidth / img.width;
          const canvas = document.createElement('canvas');
          canvas.width = maxWidth;
          canvas.height = Math.round(img.height * ratio);
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          callback(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function insertImageToEditor(dataUrl) {
      const editor = document.getElementById('entryEditor');
      editor.focus();
      const img = document.createElement('img');
      img.src = dataUrl;
      img.style.maxWidth = '100%';
      img.style.borderRadius = '10px';
      img.style.margin = '8px 0';
      img.style.boxShadow = '0 1px 3px rgba(0,0,0,0.04)';
      const selection = window.getSelection();
      if (selection.rangeCount) {
        const range = selection.getRangeAt(0);
        range.collapse(false);
        range.insertNode(img);
        range.setStartAfter(img);
        range.collapse(true);
        selection.removeAllRanges();
        selection.addRange(range);
      } else {
        editor.appendChild(img);
      }
    }

    // 图片上传处理
    document.getElementById('imageUpload').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      compressImage(file, 1200, 0.75, function(dataUrl) {
        insertImageToEditor(dataUrl);
      });
      this.value = '';
    });

    // 编辑器粘贴截图支持
    document.getElementById('entryEditor').addEventListener('paste', function(e) {
      const items = e.clipboardData?.items;
      if (!items) return;
      for (const item of items) {
        if (item.type.startsWith('image/')) {
          e.preventDefault();
          const file = item.getAsFile();
          compressImage(file, 1200, 0.75, function(dataUrl) {
            document.execCommand('insertImage', false, dataUrl);
            const imgs = document.getElementById('entryEditor').querySelectorAll('img');
            imgs.forEach(img => {
              img.style.maxWidth = '100%';
              img.style.borderRadius = '10px';
              img.style.margin = '8px 0';
            });
          });
          break;
        }
      }
    });

    // 右键菜单事件
    document.getElementById('ctxViewDay').addEventListener('click', () => {
      hideContextMenu();
      if (contextMenuDate) { selectedDate = contextMenuDate; showView('day'); }
    });
    document.getElementById('ctxAddTask').addEventListener('click', () => {
      const dateStr = contextMenuDate;
      hideContextMenu();
      if (dateStr) showQuickTaskModal(dateStr);
    });
    document.getElementById('ctxAddEntry').addEventListener('click', () => {
      hideContextMenu();
      if (contextMenuDate) { selectedDate = contextMenuDate; editingEntryId = null; showView('edit'); }
    });
    document.addEventListener('click', () => hideContextMenu());
    document.addEventListener('contextmenu', e => {
      if (!e.target.closest('.calendar-day')) hideContextMenu();
    });

    // 悬浮卡片鼠标进出（防止从日期按钮移到卡片上时消失）
    const tooltip = document.getElementById('dayTooltip');
    tooltip.addEventListener('mouseenter', () => clearTimeout(tooltipTimer));
    tooltip.addEventListener('mouseleave', () => {
      tooltipTimer = setTimeout(hideDayTooltip, 150);
    });
    document.getElementById('tooltipClose').addEventListener('click', hideDayTooltip);

    // 触摸设备检测与适配
    const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    let touchStartY = 0;
    let longPressTimer = null;
    let lastTouchEndTime = 0;

    if (isTouchDevice) {
      // 移动端：长按日期显示预览，松开进入详情
      document.getElementById('calendarGrid').addEventListener('touchstart', e => {
        const btn = e.target.closest('.calendar-day');
        if (!btn) return;
        touchStartY = e.touches[0].clientY;
        const dateStr = btn.dataset.date;
        longPressTimer = setTimeout(() => {
          showDayTooltip(btn, dateStr);
          longPressTimer = null;
        }, 500);
      }, { passive: true });

      document.getElementById('calendarGrid').addEventListener('touchmove', e => {
        if (longPressTimer) {
          const dy = Math.abs(e.touches[0].clientY - touchStartY);
          if (dy > 10) {
            clearTimeout(longPressTimer);
            longPressTimer = null;
          }
        }
      }, { passive: true });

      document.getElementById('calendarGrid').addEventListener('touchend', e => {
        lastTouchEndTime = Date.now();
        if (longPressTimer) {
          clearTimeout(longPressTimer);
          longPressTimer = null;
          const btn = e.target.closest('.calendar-day');
          if (!document.getElementById('dayTooltip').classList.contains('visible')) {
            if (btn) {
              selectedDate = btn.dataset.date;
              hideDayTooltip();
              showView('day');
            }
          }
          // 预览已显示时，保持显示，让用户看完再手动关闭
        }
      });
    }

    // 设置弹窗
    const settingsModal = document.getElementById('settingsModal');
    document.getElementById('settingsBtn').addEventListener('click', () => {
      updateStorageUsage();
      settingsModal.classList.remove('hidden');
    });
    document.getElementById('settingsClose').addEventListener('click', () => settingsModal.classList.add('hidden'));
    settingsModal.addEventListener('click', e => { if (e.target === settingsModal) settingsModal.classList.add('hidden'); });

    function getStorageUsage() {
      let total = 0;
      Object.values(STORAGE_KEYS).forEach(key => {
        const val = localStorage.getItem(key);
        if (val) total += new Blob([val]).size;
      });
      return total;
    }
    function updateStorageUsage() {
      const bytes = getStorageUsage();
      const mb = (bytes / (1024 * 1024)).toFixed(2);
      const kb = (bytes / 1024).toFixed(0);
      let display = kb < 1024 ? `${kb} KB` : `${mb} MB`;
      // 估算可用空间（localStorage 通常5MB上限）
      const usedPercent = Math.min(100, (bytes / (5 * 1024 * 1024)) * 100).toFixed(1);
      document.getElementById('storageUsage').textContent = `${display} · 约占 ${usedPercent}%`;
    }

    // 导出
    document.getElementById('exportBtn').addEventListener('click', () => {
      const exportData = {};
      Object.entries(STORAGE_KEYS).forEach(([name, key]) => {
        exportData[name] = loadData(key);
      });
      const json = JSON.stringify(exportData, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const now = new Date();
      const ts = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;
      a.download = `worklog_backup_${ts}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    // 导入
    document.getElementById('importBtn').addEventListener('click', () => {
      document.getElementById('importFileInput').click();
    });
    document.getElementById('importFileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        try {
          const importData = JSON.parse(ev.target.result);
          let mergedCount = 0;
          Object.entries(STORAGE_KEYS).forEach(([name, key]) => {
            if (importData[name] && Array.isArray(importData[name])) {
              const existing = loadData(key);
              const existingIds = new Set(existing.map(e => e.id));
              const newItems = importData[name].filter(e => !existingIds.has(e.id));
              if (newItems.length > 0) {
                saveData(key, [...existing, ...newItems]);
                mergedCount += newItems.length;
              }
            }
            if (importData[name] && typeof importData[name] === 'object' && !Array.isArray(importData[name])) {
              // completions 是对象格式
              const existing = loadData(key, {});
              const merged = { ...importData[name], ...existing };
              saveData(key, merged);
            }
          });
          // 重新加载数据
          entries = loadData(STORAGE_KEYS.entries);
          recurringTasks = loadData(STORAGE_KEYS.recurringTasks);
          tags = loadData(STORAGE_KEYS.tags, ['项目A', '会议', '学习']);
          completions = loadData(STORAGE_KEYS.completions, {});
          oneTimeTasks = loadData(STORAGE_KEYS.oneTimeTasks);
          alert(`导入成功！合并了 ${mergedCount} 条新数据。`);
          settingsModal.classList.add('hidden');
          renderCalendar();
          updateStorageUsage();
        } catch (err) {
          alert('导入失败：文件格式不正确。');
        }
      };
      reader.readAsText(file);
      this.value = '';
    });

    // 初始化
    showView('calendar');
  </script>
